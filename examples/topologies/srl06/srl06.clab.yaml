# topology: 6 Nokia SR Linux nodes connected in a chain
# srl1 -- srl2 -- srl3 -- srl4 -- srl5 -- srl6
name: srl06

topology:
  nodes:
    srl1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux
      startup-config: srl1.cfg
    srl2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux
      startup-config: srl2.cfg
    srl3:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux
      startup-config: srl3.cfg
    srl4:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux
      startup-config: srl4.cfg
    srl5:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux
      startup-config: srl5.cfg
    srl6:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux
      startup-config: srl6.cfg

  links:
    - endpoints: ["srl1:e1-1", "srl2:e1-1"]
    - endpoints: ["srl2:e1-2", "srl3:e1-1"]
    - endpoints: ["srl3:e1-2", "srl4:e1-1"]
    - endpoints: ["srl4:e1-2", "srl5:e1-1"]
    - endpoints: ["srl5:e1-2", "srl6:e1-1"]
