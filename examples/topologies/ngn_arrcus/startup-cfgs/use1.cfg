    qos {
        network-queue "UPF-NETWORK-QUEUE" {
            description "UPF-NETWORK-QUEUE"
            fc be {
            }
            fc l2 {
                queue 2
            }
            fc af {
                queue 3
            }
            fc l1 {
                queue 4
            }
            fc ef {
                queue 5
            }
            fc h1 {
                queue 6
            }
            fc nc {
                queue 7
            }
            queue 1 {
                cbs 25.0
                mbs 100.0
            }
            queue 2 {
                cbs 25.0
                rate {
                    cir 5
                }
            }
            queue 3 {
                queue-type expedited
                cbs 20.0
                rate {
                    cir 20
                }
            }
            queue 4 {
                queue-type expedited
                cbs 20.0
                rate {
                    cir 55
                }
            }
            queue 5 {
                queue-type expedited
                cbs 5.0
                mbs 5.0
                rate {
                    pir 10
                    cir 10
                }
            }
            queue 6 {
                cbs 5.0
                rate {
                    cir 5
                }
            }
            queue 7 {
                cbs 5.0
                rate {
                    cir 5
                }
            }
        }
        network "UPF-NETWORK-POLICY" {
            description "UPF-NETWORK-POLICY"
            policy-id 100
            ingress {
                dscp be {
                    fc be
                    profile in
                }
                dscp cs1 {
                    fc l2
                    profile in
                }
                dscp cs2 {
                    fc af
                    profile in
                }
                dscp cs3 {
                    fc l1
                    profile in
                }
                dscp cs5 {
                    fc ef
                    profile in
                }
                dscp nc1 {
                    fc h1
                    profile in
                }
                dscp nc2 {
                    fc nc
